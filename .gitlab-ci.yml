stages:
  - validate
  - deploy

variables:
  HELM_VERSION: "3.18.6"
  RELEASE_NAME: microservices
  NAMESPACE: microservices

.azure:
  image: mcr.microsoft.com/azure-cli:2.77.0
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    - az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" --federated-token "$GITLAB_OIDC_TOKEN"
    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"
    - az aks install-cli
    - curl -fsSLo helm.tar.gz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
    - tar -xzf helm.tar.gz
    - install linux-amd64/helm /usr/local/bin/helm

validate:
  stage: validate
  image:
    name: alpine/helm:3.18.6
    entrypoint: [""]
  script:
    - helm lint chart/microservices -f environments/production/values.yaml
    - helm template "$RELEASE_NAME" chart/microservices -f environments/production/values.yaml >/dev/null

deploy_production:
  extends: .azure
  stage: deploy
  environment:
    name: production
  script:
    - az aks get-credentials --resource-group "$AZURE_RESOURCE_GROUP" --name "$AKS_NAME" --overwrite-existing
    - bash scripts/deploy.sh
    - bash scripts/verify.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
