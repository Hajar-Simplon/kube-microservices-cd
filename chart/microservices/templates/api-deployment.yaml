apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}

spec:
  replicas: {{ .Values.api.replicaCount }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.api.strategy.maxUnavailable }}
      maxSurge: {{ .Values.api.strategy.maxSurge }}

  selector:
    matchLabels:
      app: api

  template:
    metadata:
      labels:
        app: api

    spec:
      {{- if .Values.global.scheduling.strictZoneAntiAffinity }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - api
              topologyKey: {{ .Values.global.scheduling.topologyKey }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [api, books, movies]
                topologyKey: kubernetes.io/hostname
      {{- end }}

      containers:
        - name: api

          image: "{{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}

          command:
            - /app/api

          env:
            - name: BOOKS_API_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-api-config
                  key: BOOKS_API_HOST

            - name: MOVIES_API_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-api-config
                  key: MOVIES_API_HOST

          ports:
            - containerPort: {{ .Values.api.containerPort }}

          {{- with .Values.api.startupProbe }}
          startupProbe:
{{ toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.api.readinessProbe }}
          readinessProbe:
{{ toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.api.livenessProbe }}
          livenessProbe:
{{ toYaml . | nindent 12 }}
          {{- end }}

          resources:
{{- toYaml .Values.api.resources | nindent 12 }}
